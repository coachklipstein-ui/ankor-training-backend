<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Manage Users</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f8fa;
        --surface: #ffffff;
        --surface-2: #eef2f6;
        --text: #19202a;
        --muted: #657184;
        --line: #d8dee8;
        --accent: #0d766e;
        --accent-strong: #095e58;
        --danger: #b42318;
        --warning: #99680f;
        --focus: #2563eb;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
      }

      button,
      input,
      textarea {
        font: inherit;
      }

      .page {
        width: min(1180px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 28px 0 40px;
      }

      .header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 20px;
      }

      h1 {
        margin: 0;
        font-size: 28px;
        line-height: 1.15;
        letter-spacing: 0;
      }

      .summary {
        margin-top: 6px;
        color: var(--muted);
        font-size: 14px;
      }

      .status {
        min-height: 24px;
        color: var(--muted);
        font-size: 14px;
        text-align: right;
      }

      .status.error {
        color: var(--danger);
      }

      .controls {
        display: grid;
        grid-template-columns: minmax(260px, 1fr) minmax(260px, 1fr) auto;
        gap: 12px;
        align-items: end;
        padding: 16px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        margin-bottom: 16px;
      }

      label {
        display: grid;
        gap: 6px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      input,
      textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        color: var(--text);
        padding: 10px 11px;
        outline: none;
      }

      textarea {
        min-height: 42px;
        max-height: 120px;
        resize: vertical;
      }

      input:focus,
      textarea:focus,
      button:focus-visible {
        border-color: var(--focus);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14);
      }

      button {
        height: 42px;
        border: 0;
        border-radius: 6px;
        padding: 0 16px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
        font-weight: 700;
        white-space: nowrap;
      }

      button:hover {
        background: var(--accent-strong);
      }

      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 10px;
      }

      .search {
        max-width: 360px;
      }

      .count {
        color: var(--muted);
        font-size: 14px;
        white-space: nowrap;
      }

      .table-wrap {
        overflow: auto;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
      }

      table {
        width: 100%;
        min-width: 760px;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
        text-align: left;
        vertical-align: middle;
        font-size: 14px;
      }

      th {
        background: var(--surface-2);
        color: #344054;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      tbody tr:last-child td {
        border-bottom: 0;
      }

      .name {
        font-weight: 700;
      }

      .muted {
        color: var(--muted);
      }

      .role {
        display: inline-flex;
        align-items: center;
        min-height: 24px;
        border-radius: 999px;
        padding: 3px 9px;
        background: #e8f5f3;
        color: #095e58;
        font-size: 12px;
        font-weight: 800;
        text-transform: capitalize;
      }

      .role.coach {
        background: #eef4ff;
        color: #1849a9;
      }

      .role.athlete {
        background: #ecfdf3;
        color: #067647;
      }

      .empty {
        padding: 36px 16px;
        color: var(--muted);
        text-align: center;
      }

      @media (max-width: 820px) {
        .page {
          width: min(100vw - 20px, 1180px);
          padding-top: 18px;
        }

        .header,
        .toolbar {
          align-items: stretch;
          flex-direction: column;
        }

        .status {
          text-align: left;
        }

        .controls {
          grid-template-columns: 1fr;
        }

        .search {
          max-width: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="header">
        <div>
          <h1>Manage Users</h1>
          <div class="summary" id="summary">No users loaded</div>
        </div>
        <div class="status" id="status"></div>
      </header>

      <section class="controls" aria-label="User list filters">
        <label>
          Org ID
          <input id="orgId" autocomplete="off" value="7498990d-aa4c-401d-92a7-67152514858a" />
        </label>
        <label>
          Access Token
          <textarea id="token" autocomplete="off" spellcheck="false"></textarea>
        </label>
        <button id="loadButton" type="button">Load Users</button>
      </section>

      <div class="toolbar">
        <input class="search" id="search" type="search" placeholder="Search users" autocomplete="off" />
        <div class="count" id="count">0 users</div>
      </div>

      <section class="table-wrap" aria-label="Users">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Role</th>
              <th>Phone</th>
              <th>Graduation Year</th>
              <th>User ID</th>
            </tr>
          </thead>
          <tbody id="usersBody">
            <tr>
              <td colspan="5">
                <div class="empty">No users loaded</div>
              </td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>

    <script>
      const API_BASE = "https://uxktwhflcaknyqvjzgdi.supabase.co/functions/v1/api";
      const state = {
        users: [],
        loading: false,
      };

      const orgInput = document.getElementById("orgId");
      const tokenInput = document.getElementById("token");
      const loadButton = document.getElementById("loadButton");
      const searchInput = document.getElementById("search");
      const usersBody = document.getElementById("usersBody");
      const statusEl = document.getElementById("status");
      const summaryEl = document.getElementById("summary");
      const countEl = document.getElementById("count");

      orgInput.value = localStorage.getItem("ankor.manageUsers.orgId") || orgInput.value;
      tokenInput.value = sessionStorage.getItem("ankor.manageUsers.token") || "";

      function setStatus(message, isError = false) {
        statusEl.textContent = message;
        statusEl.classList.toggle("error", isError);
      }

      function roleClass(role) {
        return ["coach", "athlete"].includes(role) ? `role ${role}` : "role";
      }

      function formatValue(value) {
        return value === null || value === undefined || value === "" ? "—" : String(value);
      }

      function filteredUsers() {
        const term = searchInput.value.trim().toLowerCase();
        if (!term) return state.users;
        return state.users.filter((user) => {
          return [user.full_name, user.role, user.phone, user.graduation_year, user.user_id].some((value) =>
            String(value ?? "")
              .toLowerCase()
              .includes(term),
          );
        });
      }

      function renderUsers() {
        const users = filteredUsers();
        summaryEl.textContent = state.users.length ? `${state.users.length} users loaded` : "No users loaded";
        countEl.textContent = `${users.length} ${users.length === 1 ? "user" : "users"}`;

        if (!users.length) {
          usersBody.innerHTML = `
          <tr>
            <td colspan="5">
              <div class="empty">${state.users.length ? "No matching users" : "No users loaded"}</div>
            </td>
          </tr>
        `;
          return;
        }

        usersBody.innerHTML = users
          .map(
            (user) => `
        <tr>
          <td>
            <div class="name">${escapeHtml(formatValue(user.full_name))}</div>
          </td>
          <td><span class="${roleClass(user.role)}">${escapeHtml(formatValue(user.role))}</span></td>
          <td>${escapeHtml(formatValue(user.phone))}</td>
          <td>${escapeHtml(formatValue(user.graduation_year))}</td>
          <td class="muted">${escapeHtml(formatValue(user.user_id))}</td>
        </tr>
      `,
          )
          .join("");
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      async function loadUsers() {
        const orgId = orgInput.value.trim();
        const token = tokenInput.value.trim();

        if (!orgId) {
          setStatus("Org ID is required", true);
          orgInput.focus();
          return;
        }
        if (!token) {
          setStatus("Access token is required", true);
          tokenInput.focus();
          return;
        }

        localStorage.setItem("ankor.manageUsers.orgId", orgId);
        sessionStorage.setItem("ankor.manageUsers.token", token);

        state.loading = true;
        loadButton.disabled = true;
        setStatus("Loading users");

        try {
          const response = await fetch(`${API_BASE}/users/list?org_id=${encodeURIComponent(orgId)}`, {
            method: "GET",
            headers: {
              Authorization: `Bearer ${token}`,
            },
          });
          const payload = await response.json().catch(() => null);

          if (!response.ok || !payload?.ok) {
            throw new Error(payload?.error || `Request failed with ${response.status}`);
          }

          state.users = Array.isArray(payload.items) ? payload.items : [];
          setStatus("Users loaded");
          renderUsers();
        } catch (error) {
          state.users = [];
          renderUsers();
          setStatus(error instanceof Error ? error.message : "Failed to load users", true);
        } finally {
          state.loading = false;
          loadButton.disabled = false;
        }
      }

      loadButton.addEventListener("click", loadUsers);
      searchInput.addEventListener("input", renderUsers);
      tokenInput.addEventListener("keydown", (event) => {
        if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
          loadUsers();
        }
      });
      orgInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          loadUsers();
        }
      });
    </script>
  </body>
</html>
